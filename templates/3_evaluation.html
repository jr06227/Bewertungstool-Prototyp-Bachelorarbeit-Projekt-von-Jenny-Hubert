<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3. Automatische Bewertung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b1118;
      color: #f3f4f6;
    }
    .container-card {
      background-color: #172330;
      border: 1px solid #2d3748;
      box-shadow: 0 10px 15px rgba(0,0,0,0.3);
    }
    .criteria-row {
      margin-bottom: .75rem;
    }
    .progress-bar {
      height: .75rem;
      background-color: #1e293b;
      border-radius: .375rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      transition: width 0.4s ease;
    }
    .fill-chatgpt { background-color: #5587eb; }
    .fill-asknature { background-color: #ee9857; }
    .fill-bidara { background-color: #ac6bee; }
    .title-chatgpt { color: #5587eb; }
    .title-asknature { color: #f59d59; }
    .title-bidara { color: #a766e9; }
  </style>
</head>

<body class="p-6">
  <div class="max-w-6xl mx-auto space-y-8">
    <header class="text-center">
      <h1 class="text-4xl font-extrabold mb-2 text-indigo-400">3. Automatische Bewertung</h1>
      <p class="text-gray-400 text-lg">Analyse der Tool-Ergebnisse anhand von 12 Kriterien</p>
    </header>

    <div id="hintBlock" class="bg-yellow-900/40 text-yellow-300 p-4 rounded-lg border border-yellow-600 text-center">
      ⚠️ Bitte füllen Sie in <strong>Schritt 2</strong> alle drei Tool-Ausgaben aus, um eine Bewertung zu erhalten.
    </div>

    <div id="evaluationBlock" class="hidden container-card p-6 rounded-xl space-y-6">
      <h2 class="text-2xl font-bold text-indigo-400 flex items-center mb-4">
        <i data-lucide="check-circle" class="mr-2 h-6 w-6"></i> Bewertungsübersicht
      </h2>

      <div id="score_container" class="space-y-8"></div>

      <div class="flex justify-between mt-8">
        <a href="2_tools.html" class="px-6 py-3 bg-gray-700 rounded-lg hover:bg-gray-600 flex items-center text-gray-200 font-semibold shadow-md">
          <i data-lucide="arrow-left" class="mr-2 h-5 w-5"></i> Zurück zu Schritt 2
        </a>
        <a href="4_results.html" class="px-6 py-3 bg-indigo-600 rounded-lg hover:bg-indigo-500 flex items-center text-white font-semibold shadow-md">
          Weiter zu Schritt 4 <i data-lucide="arrow-right" class="ml-2 h-5 w-5"></i>
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    const tools = ["chatgpt", "asknature", "bidara"];
    const criteria = [
      "Fachliche Relevanz & Genauigkeit",
      "Übertragbarkeit biologischer Prinzipien in technische Kontexte",
      "Innovations- & Ideenqualität",
      "Wissensbasis & Aktualität",
      "Zuverlässigkeit & Konsistenz",
      "Erklärbarkeit & Nachvollziehbarkeit",
      "Transparenz der Quellenangaben",
      "Praktische Einsetzbarkeit für Innovationsprozesse",
      "Integrationsfähigkeit & Erweiterbarkeit",
      "Interaktivität & Nutzerführung",
      "Benutzerfreundlichkeit",
      "Eignung für unterschiedliche Zielgruppen und Anwendungsszenarien"
    ];

    function analyzeText(text) {
      const t = (text || "").toLowerCase();
      const words = t.split(/\s+/).length;

      const explicitSources = /(http|https|doi|isbn|et al\.|journal|nature|science|ieee|springer)/;
      const vagueSources = /(studien zeigen|forschung zeigt|stand der technik|bekannt)/;

      const lengthScore = Math.min(100, Math.log(words + 1) * 15);
      const sourceScore = explicitSources.test(t) ? 100 : vagueSources.test(t) ? 60 : 30;

      const total = (lengthScore * 0.4) + (sourceScore * 0.6);

      return Array.from({ length: 12 }, (_, i) => {
        const smoothing = (i - 5.5) * 0.4; // max ±2.2 %
        return Math.max(30, Math.min(100, total + smoothing));
      });
    }

    function evaluateTools() {
      const hintBlock = document.getElementById("hintBlock");
      const evalBlock = document.getElementById("evaluationBlock");
      const container = document.getElementById("score_container");

      const responses = {
        chatgpt: localStorage.getItem("chatgpt_response") || "",
        asknature: localStorage.getItem("asknature_response") || "",
        bidara: localStorage.getItem("bidara_response") || ""
      };

      if (Object.values(responses).some(r => !r.trim())) {
        hintBlock.classList.remove("hidden");
        evalBlock.classList.add("hidden");
        return;
      }

      hintBlock.classList.add("hidden");
      evalBlock.classList.remove("hidden");
      container.innerHTML = "";

      Object.entries(responses).forEach(([tool, text]) => {
        const scores = analyzeText(text);
        const avg = scores.reduce((a, b) => a + b, 0) / scores.length;

        localStorage.setItem(`final_score_${tool}`, avg.toFixed(1));
        localStorage.setItem(`detailed_scores_${tool}`, JSON.stringify(scores));

        const color = tool === "chatgpt" ? "fill-chatgpt" : tool === "asknature" ? "fill-asknature" : "fill-bidara";
        const title = tool === "chatgpt" ? "title-chatgpt" : tool === "asknature" ? "title-asknature" : "title-bidara";

        let html = `
          <div class="p-4 bg-gray-800/30 rounded-lg border border-gray-700">
            <div class="flex justify-between items-center mb-4">
              <div class="text-xl font-bold capitalize ${title}">${tool}</div>
              <div class="text-2xl font-extrabold ${title}">${avg.toFixed(1)}%</div>
            </div>
        `;

        scores.forEach((s, i) => {
          html += `
            <div class="criteria-row">
              <div class="flex justify-between text-sm text-gray-300 mb-1">
                <span>${i + 1}. ${criteria[i]}</span>
                <span class="font-semibold">${Math.round(s)}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill ${color}" style="width:${Math.round(s)}%"></div>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        container.innerHTML += html;
      });

      lucide.createIcons();
    }

    document.addEventListener("DOMContentLoaded", evaluateTools);
  </script>
</body>
</html>
