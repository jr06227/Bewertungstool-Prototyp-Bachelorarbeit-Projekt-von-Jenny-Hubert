<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Szenario definieren</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1118;
            color: #f3f4f6;
        }
        .container-card {
            background-color: #172330;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid #2d3748;
        }
        textarea {
            background-color: #1e293b;
            border: 1px solid #374151;
            color: #f3f4f6;
            border-radius: 0.5rem;
            padding: 1rem;
            width: 100%;
            resize: vertical;
        }
    </style>
</head>
<body class="p-6 sm:p-10">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-gray-100 mb-2">1. Szenario definieren</h1>
            <p class="text-gray-400">Definieren Sie die Problemstellung und formulieren Sie ein passendes Prompt.</p>
        </header>

        <div class="container-card p-6 rounded-xl space-y-6">
            <div>
                <label class="text-lg font-semibold text-indigo-400">Problemstellung</label>
                <textarea id="problem_input" rows="5" placeholder="Beschreiben Sie hier das Szenario oder Problem..."></textarea>
                <div class="flex space-x-3 mt-2">
                    <button id="clear_problem" class="px-4 py-2 bg-gray-700 text-gray-200 font-semibold rounded-lg hover:bg-gray-600 transition">Problem löschen</button>
                </div>
            </div>

            <div>
                <label class="text-lg font-semibold text-indigo-400">Prompt</label>
                <textarea id="prompt_input" rows="5" placeholder="Formulieren Sie hier das Prompt für die Tools..."></textarea>
                <div class="flex space-x-3 mt-2">
                    <button id="clear_prompt" class="px-4 py-2 bg-gray-700 text-gray-200 font-semibold rounded-lg hover:bg-gray-600 transition">Prompt löschen</button>
                </div>
            </div>

            /*-- Untere Button-Leiste --*/
            <div class="flex justify-between items-center pt-4 border-t border-gray-700">
                <div class="flex space-x-3">
                        
                    <a href="{{ url_for('index') }}" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-500 transition flex items-center">
                        <i data-lucide="arrow-left" class="mr-2 w-5 h-5"></i>
                        Zurück zur Startseite
                    </a>
                    <button id="clear_all" class="px-6 py-3 bg-gray-700 text-gray-200 font-semibold rounded-lg hover:bg-gray-600 transition">
                        Alles löschen
                    </button>
                </div>

                <a href="2_tools.html" class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-500 transition flex items-center">
                    Weiter zu Schritt 2
                    <i data-lucide="arrow-right" class="ml-2 w-5 h-5"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        const problemInput = document.getElementById('problem_input');
        const promptInput = document.getElementById('prompt_input');

        /* Laden aus localStorage */
        problemInput.value = localStorage.getItem('problem_text') || '';
        promptInput.value = localStorage.getItem('prompt_text') || '';

        /* Speichern bei Eingabe */
        problemInput.addEventListener('input', () => localStorage.setItem('problem_text', problemInput.value));
        promptInput.addEventListener('input', () => localStorage.setItem('prompt_text', promptInput.value));

        /* Einzelne Lösch-Buttons */
        document.getElementById('clear_problem').addEventListener('click', () => {
            problemInput.value = '';
            localStorage.removeItem('problem_text');
        });

        document.getElementById('clear_prompt').addEventListener('click', () => {
            promptInput.value = '';
            localStorage.removeItem('prompt_text');
        });

        /* Alles löschen */
        document.getElementById('clear_all').addEventListener('click', () => {
            problemInput.value = '';
            promptInput.value = '';
            localStorage.removeItem('problem_text');
            localStorage.removeItem('prompt_text');
        });

        lucide.createIcons();
    </script>
</body>
</html>
